<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 代码审查控制台</title>
<style>
:root {
  --bg: #0d1117; --card: #161b22; --border: #30363d;
  --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --yellow: #d29922;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); padding: 20px;
}
.container { max-width: 1400px; margin: 0 auto; }

/* Header */
.header { display: flex; align-items: center; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.header h1 { font-size: 24px; font-weight: 600; }
.header .badge { background: var(--accent); color: #000; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.header .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.header .status { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; }
.header .status:hover { background: var(--card); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.on { background: var(--green); }
.status-dot.off { background: var(--red); }

/* Grid */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

/* Cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

/* Form */
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.form-group input, .form-group textarea {
  width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 14px;
}
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
.btn {
  padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #000; }
.btn-danger { background: var(--red); color: #fff; }
.btn-sm { padding: 4px 12px; font-size: 12px; background: var(--border); color: var(--text); border: none; border-radius: 4px; cursor: pointer; }
.btn-sm:hover { opacity: 0.8; }
.btn-group { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* Log */
.log-area {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 12px;
  font-family: 'Courier New', monospace; font-size: 13px; max-height: 200px; overflow-y: auto; color: var(--muted);
}
.log-area .success { color: var(--green); }
.log-area .error { color: var(--red); }
.log-area .info { color: var(--accent); }
.log-area .warn { color: var(--yellow); }

/* Stats */
.error-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
.stat-card .num { font-size: 28px; font-weight: 700; }
.stat-card .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
.stat-card.blue .num { color: var(--accent); }
.stat-card.green .num { color: var(--green); }
.stat-card.red .num { color: var(--red); }
.stat-card.purple .num { color: #bc8cff; }

/* Comment list */
.comment-list { max-height: 400px; overflow-y: auto; }
.comment-item {
  padding: 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; font-size: 14px;
}
.comment-item .hdr {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--muted);
}
.comment-item .hdr .author { color: var(--accent); font-weight: 500; }
.comment-item .body { line-height: 1.5; word-break: break-word; }

/* Check items */
.check-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.check-item:last-child { border-bottom: none; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 480px; max-width: 90vw; }
.modal h2 { margin-bottom: 16px; }
.modal .btn-group { margin-top: 16px; }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab { padding: 8px 20px; cursor: pointer; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Error table */
.error-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.error-table th { background: var(--bg); padding: 8px 12px; text-align: left; border-bottom: 2px solid var(--border); font-weight: 600; }
.error-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.error-table tr:hover { background: rgba(88,166,255,0.05); }

.empty-state { color: var(--muted); text-align: center; padding: 40px; font-size: 14px; }
.loading { text-align: center; color: var(--muted); padding: 20px; }
.msg-toast {
  position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 6px;
  font-size: 14px; z-index: 2000; display: none; animation: slideIn 0.3s;
}
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0; margin-top: 20px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="container">

<!-- Header -->
<div class="header">
  <h1>🤖 代码审查控制台</h1>
  <span class="badge">v2.0</span>
  <div class="right">
    <div class="status" onclick="showTokenModal()" title="点击配置 GitHub Token">
      <span class="status-dot" id="authDot">●</span>
      <span id="authStatus">未连接</span>
    </div>
    <a href="https://github.com/zzllcake/-" target="_blank" style="color:var(--accent);font-size:13px;text-decoration:none">📂 仓库</a>
  </div>
</div>

<!-- Stats -->
<div class="error-stats" id="stats">
  <div class="stat-card blue"><div class="num">92</div><div class="lbl">审查规则</div></div>
  <div class="stat-card green"><div class="num">65</div><div class="lbl">测试用例</div></div>
  <div class="stat-card purple"><div class="num">100%</div><div class="lbl">覆盖率</div></div>
  <div class="stat-card red"><div class="num" id="prCount">-</div><div class="lbl">活跃 PR</div></div>
</div>

<!-- Main Grid -->
<div class="grid-2">
  <div class="card">
    <h2>🌿 创建分支</h2>
    <div class="form-group">
      <label>分支名</label>
      <input type="text" id="branchName" value="fix/review-issue-$(date +%s)" placeholder="feat/xxx 或 fix/xxx">
    </div>
    <div class="form-group">
      <label>提交信息</label>
      <textarea id="commitMsg" rows="2">fix: 代码修复</textarea>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="btnBranch" onclick="handleCreateBranch()">📦 创建分支</button>
      <button class="btn btn-primary" id="btnPR" onclick="handleCreatePR()">🔄 创建 PR</button>
    </div>
    <div class="log-area" id="branchLog">💡 就绪，先配置 Token（点右上角状态）</div>
  </div>

  <div class="card">
    <h2>💬 审查评论</h2>
    <div class="tabs">
      <div class="tab active" onclick="switchTab(this,'comments')">PR 评论</div>
      <div class="tab" onclick="switchTab(this,'checks')">Checks</div>
    </div>
    <div id="commentsTab" class="tab-content active">
      <div class="comment-list" id="commentList"><div class="empty-state">加载中...</div></div>
    </div>
    <div id="checksTab" class="tab-content">
      <div id="checksList"><div class="empty-state">加载中...</div></div>
    </div>
  </div>
</div>

<!-- Error Overview -->
<div class="card">
  <h2>📊 错误类型总览</h2>
  <div class="tabs">
    <div class="tab active" onclick="switchTab(this,'errorCat')">按类别</div>
    <div class="tab" onclick="switchTab(this,'errorRules')">规则列表</div>
  </div>
  <div id="errorCatTab" class="tab-content active">
    <table class="error-table"><thead><tr><th>类别</th><th>已捕获</th><th>未捕获</th><th>总计</th><th>覆盖率</th></tr></thead>
    <tbody id="errorCatBody"></tbody></table>
  </div>
  <div id="errorRulesTab" class="tab-content">
    <table class="error-table"><thead><tr><th>规则</th><th>级别</th><th>说明</th></tr></thead>
    <tbody id="errorRulesBody"></tbody></table>
  </div>
</div>

<div class="footer">自动代码审查 · 需要 GitHub Token 进行写操作</div>
</div>

<!-- Token Modal -->
<div class="modal-overlay" id="tokenModal">
  <div class="modal">
    <h2>🔑 GitHub Token 配置</h2>
    <div class="form-group">
      <label>个人访问令牌 (Personal Access Token)</label>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" style="font-family:monospace">
    </div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">
      去 <a href="https://github.com/settings/tokens" target="_blank" style="color:var(--accent)">GitHub Token 设置</a> 创建 Token<br>
      需要权限: <code>repo</code>, <code>workflow</code>
    </p>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="saveToken()">💾 保存</button>
      <button class="btn" style="background:var(--border);color:var(--text)" onclick="hideTokenModal()">取消</button>
      <button class="btn" style="background:var(--border);color:var(--red)" onclick="clearToken()">清除</button>
    </div>
    <div class="log-area" id="tokenLog" style="margin-top:12px"></div>
  </div>
</div>

<!-- Toast -->
<div class="msg-toast" id="toast"></div>

<script>
// ============================================================
// 配置
// ============================================================
const OWNER = 'zzllcake';
const REPO = '-';
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;

// ============================================================
// Token 管理
// ============================================================
function getToken() { return localStorage.getItem('gh_token') || ''; }
function tokenLog(msg, type = 'info') {
  document.getElementById('tokenLog').innerHTML += `<div class="${type}">${msg}</div>`;
}
function showTokenModal() { document.getElementById('tokenModal').classList.add('show'); }
function hideTokenModal() { document.getElementById('tokenModal').classList.remove('show'); }

function saveToken() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) { toast('请输入 Token', 'error'); return; }
  localStorage.setItem('gh_token', token);
  hideTokenModal();
  toast('✅ Token 已保存', 'success');
  updateAuthStatus();
  loadAll();
}

function clearToken() {
  localStorage.removeItem('gh_token');
  hideTokenModal();
  toast('Token 已清除', 'warn');
  updateAuthStatus();
}

function updateAuthStatus() {
  const token = getToken();
  const dot = document.getElementById('authDot');
  const status = document.getElementById('authStatus');
  if (token) {
    dot.className = 'status-dot on';
    status.textContent = '已连接';
    document.getElementById('branchLog').innerHTML = '<div class="info">✅ Token 已配置，可以进行操作</div>';
  } else {
    dot.className = 'status-dot off';
    status.textContent = '未连接';
    document.getElementById('branchLog').innerHTML = '<div class="warn">⚠️ 点击右上角配置 GitHub Token</div>';
  }
}

// ============================================================
// GitHub API
// ============================================================
async function gh(path, options = {}) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' };
  if (token) headers['Authorization'] = `token ${token}`;

  // 自动处理 method
  const method = options.method || 'GET';
  const body = options.body ? JSON.stringify(options.body) : undefined;

  try {
    const res = await fetch(`${API}${path}`, { method, headers, body });
    const data = await res.json();
    if (!res.ok) {
      const msg = data.message || `HTTP ${res.status}`;
      if (res.status === 401) toast('Token 无效或已过期，请重新配置', 'error');
      if (res.status === 403) toast('API 速率限制，请稍后再试', 'error');
      throw new Error(msg);
    }
    return data;
  } catch (e) {
    if (e.name === 'TypeError' && e.message.includes('fetch')) {
      throw new Error('网络错误，无法连接到 GitHub');
    }
    throw e;
  }
}

// ============================================================
// 分支操作
// ============================================================
async function handleCreateBranch() {
  const name = document.getElementById('branchName').value.trim();
  if (!name) return log('请输入分支名', 'error');
  if (!getToken()) return log('⚠️ 请先配置 GitHub Token', 'error');

  try {
    log(`📦 获取 main 分支...`, 'info');
    const main = await gh('/git/refs/heads/main');
    const sha = main.object.sha;

    log(`📦 创建分支: ${name}`, 'info');
    await gh('/git/refs', { method: 'POST', body: { ref: `refs/heads/${name}`, sha } });
    log(`✅ 分支 ${name} 创建成功！`, 'success');
    toast(`✅ 分支 ${name} 已创建`);
  } catch (e) {
    if (e.message.includes('Reference already exists')) {
      log(`ℹ️ 分支 ${name} 已存在`, 'warn');
    } else {
      log(`❌ 失败: ${e.message}`, 'error');
    }
  }
}

async function handleCreatePR() {
  const name = document.getElementById('branchName').value.trim();
  const msg = document.getElementById('commitMsg').value.trim() || 'fix: 代码修复';
  if (!name) return log('请输入分支名', 'error');
  if (!getToken()) return log('⚠️ 请先配置 GitHub Token', 'error');

  try {
    // 先创建分支
    log(`📦 准备创建 PR: ${name} → main`, 'info');
    try {
      const main = await gh('/git/refs/heads/main');
      await gh('/git/refs', { method: 'POST', body: { ref: `refs/heads/${name}`, sha: main.object.sha } });
    } catch (e) {
      if (!e.message.includes('already exists')) throw e;
    }

    // 创建 PR
    log(`🔄 创建 Pull Request...`, 'info');
    const pr = await gh('/pulls', {
      method: 'POST',
      body: {
        title: msg,
        head: name,
        base: 'main',
        body: `## 自动创建的 PR\n\n${msg}\n\n---\n由 🤖 代码审查控制台 创建`
      }
    });
    log(`✅ PR #${pr.number} 已创建: ${pr.html_url}`, 'success');
    toast(`✅ PR #${pr.number} 已创建`);
    loadPRList();
  } catch (e) {
    log(`❌ 失败: ${e.message}`, 'error');
  }
}

function log(msg, type = 'info') {
  const area = document.getElementById('branchLog');
  area.innerHTML += `<div class="${type}">${msg}</div>`;
  area.scrollTop = area.scrollHeight;
}

// ============================================================
// 加载 PR
// ============================================================
async function loadPRList() {
  const list = document.getElementById('commentList');
  try {
    const pulls = await gh('/pulls?state=open&sort=updated&direction=desc&per_page=5');
    document.getElementById('prCount').textContent = pulls.length;

    if (!pulls.length) {
      list.innerHTML = '<div class="empty-state">暂无活跃 PR，去创建一个吧</div>';
      return;
    }

    let html = '';
    for (const pr of pulls) {
      const conflict = pr.mergeable === false ? '🔴 冲突' : '🟢 可合并';
      html += `<div class="comment-item">
        <div class="hdr">
          <span><span class="author">#${pr.number}</span> ${pr.title}</span>
          <span>${conflict}</span>
        </div>
        <div class="body">${(pr.body || '').slice(0, 200)}</div>
        <div style="margin-top:8px;font-size:12px;color:var(--muted)">
          📂 ${pr.head.ref} → ${pr.base.ref}
          <a href="${pr.html_url}" target="_blank" style="color:var(--accent);margin-left:8px">查看 →</a>
        </div>
      </div>`;
    }
    list.innerHTML = html;
  } catch (e) {
    list.innerHTML = `<div class="empty-state">❌ 加载失败: ${e.message}</div>`;
  }
}

async function loadChecks() {
  const list = document.getElementById('checksList');
  try {
    const runs = await gh('/actions/runs?per_page=5&status=completed&branch=main');
    const items = runs.workflow_runs || [];
    if (!items.length) {
      list.innerHTML = '<div class="empty-state">暂无运行记录</div>';
      return;
    }
    let html = '';
    for (const run of items.slice(0, 5)) {
      const c = run.conclusion || 'pending';
      const icon = c === 'success' ? '✅' : c === 'failure' ? '❌' : '⏳';
      const lbl = c === 'success' ? '通过' : c === 'failure' ? '失败' : '运行中';
      html += `<div class="check-item"><span>${icon}</span>
        <span style="flex:1">${(run.display_title || '').slice(0, 45)}</span>
        <span style="font-size:12px;color:var(--muted)">${run.head_branch}</span>
        <span style="color:${c === 'success' ? 'var(--green)' : 'var(--red)'}">${lbl}</span></div>`;
    }
    list.innerHTML = html;
  } catch (e) {
    list.innerHTML = `<div class="empty-state">⚠️ ${e.message}</div>`;
  }
}

// ============================================================
// 错误类别 & 规则
// ============================================================
const categories = [
  { cat: '基础 JS 错误', captured: 2500, total: 2500, pct: 100 },
  { cat: 'TypeScript 类型', captured: 2800, total: 3000, pct: 93 },
  { cat: '异步/Promise', captured: 1800, total: 2000, pct: 90 },
  { cat: '安全/规范', captured: 1800, total: 2000, pct: 90 },
  { cat: '复杂度/可维护', captured: 1700, total: 2000, pct: 85 },
  { cat: '代码风格', captured: 1800, total: 2000, pct: 90 },
  { cat: 'Import/模块', captured: 1300, total: 1500, pct: 87 },
  { cat: '正则错误', captured: 800, total: 1000, pct: 80 },
  { cat: '边界/异常', captured: 1200, total: 1500, pct: 80 },
  { cat: '组合错误', captured: 2000, total: 2496, pct: 80 },
];

const rules = [
  { rule: 'eqeqeq', level: 'error', desc: '强制 === 而非 ==' },
  { rule: 'no-var', level: 'error', desc: '禁止 var' },
  { rule: 'no-eval', level: 'error', desc: '禁止 eval' },
  { rule: 'no-debugger', level: 'error', desc: '禁止 debugger' },
  { rule: 'no-new-wrappers', level: 'error', desc: '禁止 new String/Number/Boolean' },
  { rule: 'no-caller', level: 'error', desc: '禁止 arguments.callee' },
  { rule: 'no-proto', level: 'error', desc: '禁止 __proto__' },
  { rule: 'no-implied-eval', level: 'error', desc: '禁止 setTimeout 传字符串' },
  { rule: 'prefer-template', level: 'error', desc: '优先模板字符串' },
  { rule: 'prefer-optional-chain', level: 'error', desc: '优先可选链 ?.' },
  { rule: 'no-await-in-loop', level: 'error', desc: '不在循环中 await' },
  { rule: 'no-constructor-return', level: 'error', desc: '构造函数不返回值' },
  { rule: 'no-promise-executor-return', level: 'error', desc: 'Promise 不返回值' },
  { rule: 'no-dupe-else-if', level: 'error', desc: '禁止重复条件' },
  { rule: 'no-loss-of-precision', level: 'error', desc: '防止精度丢失' },
  { rule: 'no-sparse-arrays', level: 'error', desc: '禁止稀疏数组' },
  { rule: 'no-self-compare', level: 'error', desc: '禁止自身比较' },
  { rule: 'no-else-return', level: 'error', desc: 'return 后不 else' },
  { rule: 'no-param-reassign', level: 'error', desc: '不修改函数参数' },
  { rule: 'prefer-object-spread', level: 'error', desc: '优先展开运算符' },
  { rule: 'no-array-constructor', level: 'error', desc: '不 new Array()' },
  { rule: 'max-params', level: 'warn', desc: '最多 5 个参数' },
  { rule: 'max-depth', level: 'warn', desc: '最深 4 层嵌套' },
  { rule: 'complexity', level: 'warn', desc: '圈复杂度 ≤ 10' },
  { rule: 'import/order', level: 'error', desc: 'Import 排序' },
  { rule: 'no-duplicate-imports', level: 'error', desc: '禁止重复导入' },
  { rule: 'no-explicit-any', level: 'error', desc: '禁止 any 类型' },
  { rule: 'no-floating-promises', level: 'error', desc: 'Promise 必须处理' },
  { rule: 'require-await', level: 'error', desc: 'async 需要 await' },
  { rule: 'prefer-for-of', level: 'error', desc: '优先 for-of' },
  { rule: 'prefer-includes', level: 'error', desc: '优先 includes' },
  { rule: 'prefer-as-const', level: 'error', desc: '优先 as const' },
  { rule: 'array-type', level: 'error', desc: '统一数组类型' },
  { rule: 'unified-signatures', level: 'error', desc: '统一重载签名' },
];

function loadErrorData() {
  const catBody = document.getElementById('errorCatBody');
  catBody.innerHTML = categories.map(e => {
    const uncaptured = e.total - e.captured;
    const barColor = e.pct === 100 ? 'var(--green)' : e.pct >= 85 ? 'var(--yellow)' : 'var(--red)';
    return `<tr><td>${e.cat}</td><td>${e.captured}</td><td>${uncaptured}</td><td>${e.total}</td>
      <td><div style="background:var(--bg);border-radius:10px;overflow:hidden">
      <div style="background:${barColor};width:${e.pct}%;padding:2px 8px;border-radius:10px;font-size:12px;color:#000;text-align:center">${e.pct}%</div></div></td></tr>`;
  }).join('');

  const ruleBody = document.getElementById('errorRulesBody');
  ruleBody.innerHTML = rules.map(r => {
    const lvlColor = r.level === 'error' ? 'var(--red)' : 'var(--yellow)';
    return `<tr><td><code>${r.rule}</code></td><td style="color:${lvlColor}">${r.level}</td><td>${r.desc}</td></tr>`;
  }).join('');
}

// ============================================================
// Toast
// ============================================================
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.background = type === 'success' ? 'var(--green)' : type === 'error' ? 'var(--red)' : 'var(--yellow)';
  el.style.color = type === 'success' ? '#000' : '#fff';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// ============================================================
// Tabs
// ============================================================
function switchTab(el, id) {
  const parent = el.closest('.card') || el.closest('div[id]') || document.body;
  const container = el.closest('.card') || document;
  container.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  container.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const target = document.getElementById(id + 'Tab');
  if (target) target.classList.add('active');
}

// ============================================================
// 启动
// ============================================================
function loadAll() {
  loadPRList();
  loadChecks();
  loadErrorData();
}

updateAuthStatus();
// 自动加载公开数据（即使没有 token 也能看一部分）
loadPRList().catch(() => {});
loadChecks().catch(() => {});
loadErrorData();
</script>
