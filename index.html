<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 代码审查控制台</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px;height:100vh;overflow:hidden}
.container{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;height:100%}
.header{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:14px;flex-shrink:0}
.header h1{font-size:20px;font-weight:600}
.header .status{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 12px;border:1px solid var(--border);border-radius:6px;margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:var(--green)}
.dot.off{background:var(--red)}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#000}
.btn-sm{padding:4px 10px;font-size:12px;background:var(--border);color:var(--text);border:none;border-radius:4px;cursor:pointer}

.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;flex:1;min-height:0}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

.sidebar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;overflow-y:auto}
.sidebar h2{font-size:14px;font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.form-row{display:flex;gap:6px;margin-bottom:10px}
.form-row input{flex:1;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;min-width:0}
.form-row input:focus{outline:none;border-color:var(--accent)}
.branch-item{padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:13px;transition:all .15s}
.branch-item:hover{background:rgba(88,166,255,.08);border-color:var(--accent)}
.branch-item.active{background:rgba(88,166,255,.15);border-color:var(--accent)}
.branch-item .name{font-weight:500;margin-bottom:4px;word-break:break-all;font-size:12px}
.branch-item .meta{display:flex;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;display:inline-block;margin-top:5px}
.tag.err{background:rgba(248,81,73,.2);color:var(--red)}
.tag.warn{background:rgba(210,153,34,.2);color:var(--yellow)}
.tag.ok{background:rgba(63,185,80,.2);color:var(--green)}
.tag.info{background:rgba(88,166,255,.2);color:var(--accent)}

.main{display:flex;flex-direction:column;min-height:0}
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;flex-shrink:0}
.toolbar .title{font-size:14px;font-weight:600;flex:1;word-break:break-all}
.content{flex:1;overflow-y:auto;min-height:0}

.summary-bar{display:flex;gap:14px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;flex-wrap:wrap}
.sum-item{display:flex;align-items:center;gap:6px;font-size:13px}
.sum-item .num{font-weight:700;font-size:17px}
.sum-item.err .num{color:var(--red)}
.sum-item.warn .num{color:var(--yellow)}
.sum-item.ok .num{color:var(--green)}
.sum-item.info .num{color:var(--accent)}

.error-group{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.group-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);cursor:pointer;font-size:13px;font-weight:500;user-select:none}
.group-header:hover{background:rgba(88,166,255,.06)}
.group-header .fname{flex:1;font-family:monospace;font-size:12px;word-break:break-all}
.group-header .count{font-size:12px;color:var(--muted);white-space:nowrap}
.group-header .arrow{transition:transform .2s;color:var(--muted);font-size:11px}
.error-group.open .arrow{transform:rotate(90deg)}
.group-body{display:none;background:var(--bg)}
.error-group.open .group-body{display:block}
.job-label{padding:5px 14px;font-size:11px;color:var(--muted);background:rgba(0,0,0,.25);border-top:1px solid var(--border)}
.error-item{padding:9px 14px;border-top:1px solid var(--border);font-size:13px;display:flex;gap:9px;align-items:flex-start}
.error-item:hover{background:rgba(88,166,255,.04)}
.error-item .icon{flex-shrink:0;font-size:12px;margin-top:1px}
.error-item .info{flex:1;min-width:0}
.error-item .loc{font-family:monospace;font-size:12px;margin-bottom:3px}
.error-item .loc a{color:var(--accent);text-decoration:none;word-break:break-all}
.error-item .loc a:hover{text-decoration:underline}
.error-item .msg{color:var(--text);line-height:1.45;word-break:break-word}
.error-item .rule{font-size:11px;color:var(--muted);margin-top:3px;font-family:monospace}

.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 0;flex-shrink:0}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>🤖 代码审查控制台</h1>
  <span class="status"><span class="dot off" id="statusDot"></span><span id="statusText">连接中...</span></span>
  <button class="btn btn-sm" onclick="loadAll()">🔄 刷新</button>
</div>

<div class="grid">
  <div class="sidebar">
    <h2>📂 分支 / 运行记录</h2>
    <div class="form-row">
      <input id="branchInput" placeholder="新分支名" value="fix/issue">
      <button class="btn btn-primary btn-sm" id="btnBranch" onclick="createBranch()">建分支</button>
      <button class="btn btn-primary btn-sm" id="btnPR" onclick="createPR()">建PR</button>
    </div>
    <div id="actionLog" style="display:none;margin-bottom:10px;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.5;word-break:break-all"></div>
    <div id="branchList"><div class="loading"><span class="spinner"></span>加载中...</div></div>
  </div>

  <div class="main">
    <div class="toolbar">
      <span class="title" id="detailTitle">👈 点击左侧分支查看审查错误</span>
      <span style="font-size:11px;color:var(--muted);cursor:pointer" onclick="reloadDetail()">🔄 重新加载</span>
    </div>
    <div class="content" id="detailContent">
      <div class="empty">选择左侧任意分支，查看该分支的代码审查错误详情<br><br>
      <span style="font-size:12px">包含：错误位置 · 错误类型 · 所属规则 · 分类统计</span></div>
    </div>
  </div>
</div>

<div class="footer">每次提交推送后点「🔄 刷新」获取最新审查结果</div>
</div>

<script>
let currentRunId = null;
let currentBranch = null;

async function api(path, opts) {
  const res = await fetch(`http://localhost:3456/api${path}`, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);
  return data;
}

async function loadBranches() {
  const list = document.getElementById('branchList');
  try {
    const [runsData, prs] = await Promise.all([
      api('/actions/runs?per_page=30'),
      api('/pulls?state=all&per_page=30').catch(() => [])
    ]);
    const runs = runsData.workflow_runs || [];

    const map = new Map();
    for (const run of runs) {
      const b = run.head_branch || 'unknown';
      if (!map.has(b)) map.set(b, { branch: b, runs: [], pr: null });
      map.get(b).runs.push(run);
    }
    for (const pr of prs) {
      const b = pr.head.ref;
      if (!map.has(b)) map.set(b, { branch: b, runs: [], pr: null });
      map.get(b).pr = pr;
    }

    if (map.size === 0) {
      list.innerHTML = '<div class="empty">暂无运行记录</div>';
      return;
    }

    let html = '';
    for (const [branch, d] of map) {
      const last = d.runs[0];
      const c = last?.conclusion;
      let tag = '<span class="tag info">运行中</span>';
      if (c === 'success') tag = '<span class="tag ok">✅ 通过</span>';
      else if (c === 'failure') tag = '<span class="tag err">❌ 失败</span>';
      else if (c === 'cancelled') tag = '<span class="tag warn">⏹ 已取消</span>';

      const active = (branch === currentBranch) ? ' active' : '';
      const prLabel = d.pr ? `#${d.pr.number} ` : '';
      const dateStr = last ? new Date(last.created_at).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';

      html += `<div class="branch-item${active}" onclick="selectBranch('${branch.replace(/'/g,"\\'")}', ${last?.id || 0})">
        <div class="name">${prLabel}${branch}</div>
        <div class="meta"><span>${dateStr}</span><span>${d.runs.length}次运行</span></div>
        ${tag}
      </div>`;
    }
    list.innerHTML = html;
  } catch (e) {
    list.innerHTML = `<div class="empty">❌ ${e.message}</div>`;
  }
}

async function selectBranch(branch, runId) {
  currentBranch = branch;
  currentRunId = runId;
  document.getElementById('detailTitle').textContent = `📋 ${branch}`;
  document.getElementById('detailContent').innerHTML = '<div class="loading"><span class="spinner"></span>正在获取审查错误...</div>';
  loadBranches();

  if (!runId) {
    document.getElementById('detailContent').innerHTML = '<div class="empty">该分支暂无运行记录</div>';
    return;
  }

  try {
    const jobsData = await api(`/actions/runs/${runId}/jobs`);
    const jobs = jobsData.jobs || [];

    let annotations = [];
    for (const job of jobs) {
      if (!job.check_run_url) continue;
      const cid = job.check_run_url.split('/').pop();
      try {
        const anns = await api(`/check-runs/${cid}/annotations`);
        for (const a of anns) {
          annotations.push({ ...a, jobName: job.name, jobConclusion: job.conclusion });
        }
      } catch (e) { }
    }

    renderDetail(jobs, annotations, branch, runId);
  } catch (e) {
    document.getElementById('detailContent').innerHTML =
      `<div class="empty">❌ ${e.message}<br><br><button class="btn btn-sm" onclick="selectBranch('${branch}',${runId})">重试</button></div>`;
  }
}

function reloadDetail() {
  if (currentBranch) selectBranch(currentBranch, currentRunId);
}

function renderDetail(jobs, annotations, branch, runId) {
  const c = document.getElementById('detailContent');

  // ============================================================
  // 过滤：工作流/依赖相关的噪音警告（不是代码问题）
  // ============================================================
  const NOISE_PATTERNS = [
    /Node\.js \d+ is deprecated/i,
    /CodeQL Action v\d+ will be deprecated/i,
    /target Node\.js \d+ but are being forced/i,
    /is deprecated\. The following actions/i,
    /actions\/.*@v\d+/i,
  ];
  const isNoise = (a) => {
    const msg = a.message || '';
    return NOISE_PATTERNS.some(p => p.test(msg));
  };

  const codeAnns = annotations.filter(a => !isNoise(a));
  const noiseAnns = annotations.filter(a => isNoise(a));

  const errs = codeAnns.filter(a => a.annotation_level === 'failure');
  const warns = codeAnns.filter(a => a.annotation_level === 'warning');
  const notices = codeAnns.filter(a => a.annotation_level === 'notice');
  const passed = jobs.filter(j => j.conclusion === 'success').length;
  const failed = jobs.filter(j => j.conclusion === 'failure').length;

  let html = `<div class="summary-bar">
    <div class="sum-item err"><span class="num">${errs.length}</span>错误</div>
    <div class="sum-item warn"><span class="num">${warns.length}</span>警告</div>
    <div class="sum-item info"><span class="num">${notices.length}</span>提示</div>
    <div class="sum-item ok"><span class="num">${passed}/${jobs.length}</span>Job 通过</div>
    ${failed ? `<div class="sum-item err"><span class="num">${failed}</span>Job 失败</div>` : ''}
  </div>`;

  // Job 状态
  html += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">`;
  for (const j of jobs) {
    const ic = j.conclusion === 'success' ? '✅' : j.conclusion === 'failure' ? '❌' : j.conclusion === 'cancelled' ? '⏹' : '⏳';
    const color = j.conclusion === 'failure' ? 'var(--red)' : j.conclusion === 'success' ? 'var(--green)' : 'var(--muted)';
    html += `<span style="padding:4px 10px;border:1px solid var(--border);border-radius:14px;font-size:11px;color:${color}">${ic} ${j.name}</span>`;
  }
  html += `</div>`;

  if (codeAnns.length === 0) {
    const allOk = jobs.every(j => j.conclusion === 'success');
    if (allOk && jobs.length > 0) {
      html += '<div class="empty">✅ 全部检查通过，没有发现代码错误</div>';
    } else if (jobs.length === 0) {
      html += '<div class="empty">本次运行没有 Job 数据</div>';
    } else {
      html += `<div class="empty">⚠️ 没有代码错误注解<br><br>
        <span style="font-size:12px">该运行可能因为依赖安装或其他原因失败，请点击上方 Job 卡片到 GitHub 查看日志</span></div>`;
    }
    renderNoise(html, noiseAnns, c);
    return;
  }

  // 按文件分组
  const byFile = {};
  for (const a of codeAnns) {
    const p = a.path || '(未知文件)';
    if (!byFile[p]) byFile[p] = [];
    byFile[p].push(a);
  }

  const sortedFiles = Object.entries(byFile).sort((a, b) => b[1].length - a[1].length);

  for (const [filePath, fileAnns] of sortedFiles) {
    const hasErr = fileAnns.some(a => a.annotation_level === 'failure');
    const icon = hasErr ? '🔴' : '🟡';

    html += `<div class="error-group open">
      <div class="group-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="arrow">▶</span>
        <span>${icon}</span>
        <span class="fname">${filePath}</span>
        <span class="count">${fileAnns.length} 个问题</span>
      </div>
      <div class="group-body">`;

    const byJob = {};
    for (const a of fileAnns) {
      const j = a.jobName || 'unknown';
      if (!byJob[j]) byJob[j] = [];
      byJob[j].push(a);
    }

    for (const [jobName, jobAnns] of Object.entries(byJob)) {
      html += `<div class="job-label">📋 ${jobName}</div>`;
      for (const a of jobAnns) {
        const line = a.start_line ? (a.end_line && a.end_line !== a.start_line ? `:${a.start_line}-${a.end_line}` : `:${a.start_line}`) : '';
        const lv = a.annotation_level === 'failure' ? '❌' : a.annotation_level === 'warning' ? '⚠️' : '💡';
        const msg = (a.message || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const title = (a.title || '').replace(/</g, '&lt;');
        const ghUrl = `https://github.com/zzllcake/-/blob/${branch}/${filePath}${line}`;

        html += `<div class="error-item">
          <span class="icon">${lv}</span>
          <div class="info">
            <div class="loc"><a href="${ghUrl}" target="_blank">${filePath}${line}</a></div>
            <div class="msg">${msg}</div>
            ${title && title !== msg ? `<div class="rule">${title}</div>` : ''}
          </div>
        </div>`;
      }
    }
    html += '</div></div>';
  }

  renderNoise(html, noiseAnns, c);
}

// 把工作流噪音警告折叠显示在最后
function renderNoise(html, noiseAnns, container) {
  if (noiseAnns.length > 0) {
    html += `<div class="error-group" id="noiseGroup">
      <div class="group-header" onclick="this.parentElement.classList.toggle('open')" style="opacity:.65">
        <span class="arrow">▶</span>
        <span>⚙️</span>
        <span class="fname">工作流环境提示（非代码问题）</span>
        <span class="count">${noiseAnns.length} 条</span>
      </div>
      <div class="group-body">
        <div style="padding:8px 14px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border)">
          💡 这些是 GitHub Actions 运行环境的提示（如 actions 版本、Node 版本弃用），不影响你的代码质量。
        </div>`;
    for (const a of noiseAnns.slice(0, 20)) {
      const msg = (a.message || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      html += `<div class="error-item" style="opacity:.6">
        <span class="icon">⚙️</span>
        <div class="info">
          <div class="msg" style="font-size:12px">${msg}</div>
        </div>
      </div>`;
    }
    if (noiseAnns.length > 20) {
      html += `<div style="padding:8px 14px;font-size:11px;color:var(--muted)">... 还有 ${noiseAnns.length - 20} 条</div>`;
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

// ============================================================
// 操作日志
// ============================================================
function showLog(msg, type = 'info') {
  const el = document.getElementById('actionLog');
  const colors = { info: 'var(--accent)', ok: 'var(--green)', err: 'var(--red)', warn: 'var(--yellow)' };
  const bgs = { info: 'rgba(88,166,255,.12)', ok: 'rgba(63,185,80,.12)', err: 'rgba(248,81,73,.12)', warn: 'rgba(210,153,34,.12)' };
  el.style.display = 'block';
  el.style.color = colors[type];
  el.style.background = bgs[type];
  el.innerHTML = msg;
}

function setBtnLoading(id, loading, text) {
  const btn = document.getElementById(id);
  btn.disabled = loading;
  btn.textContent = loading ? '⏳ 处理中' : text;
  btn.style.opacity = loading ? '.6' : '1';
}

// ============================================================
// 创建分支（只建分支，不建 PR）
// ============================================================
async function createBranch() {
  const name = document.getElementById('branchInput').value.trim();
  if (!name) return showLog('❌ 请输入分支名', 'err');
  if (!/^[a-zA-Z0-9._\/-]+$/.test(name)) return showLog('❌ 分支名只能包含字母数字和 . _ / -', 'err');

  setBtnLoading('btnBranch', true);
  showLog('⏳ 正在获取 main 分支信息...', 'info');

  try {
    const main = await api('/git/refs/heads/main');
    showLog('⏳ 正在创建分支 ' + name + ' ...', 'info');

    try {
      await api('/git/refs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ref: `refs/heads/${name}`, sha: main.object.sha })
      });
      showLog(`✅ 分支 <b>${name}</b> 创建成功！<br><br>
        📌 下一步：在本地推送到这个分支<br>
        <code style="font-size:11px">git push origin HEAD:${name}</code><br><br>
        💡 推送后刷新即可看到审查结果`, 'ok');
    } catch (e) {
      if (e.message.includes('already exists')) {
        showLog(`ℹ️ 分支 <b>${name}</b> 已存在，无需重复创建`, 'warn');
      } else {
        throw e;
      }
    }
    setTimeout(loadBranches, 1500);
  } catch (e) {
    showLog('❌ 创建失败: ' + e.message, 'err');
  } finally {
    setBtnLoading('btnBranch', false, '建分支');
  }
}

// ============================================================
// 创建 PR（需要分支已有提交）
// ============================================================
async function createPR() {
  const name = document.getElementById('branchInput').value.trim();
  if (!name) return showLog('❌ 请输入分支名', 'err');

  setBtnLoading('btnPR', true);
  showLog('⏳ 正在检查分支...', 'info');

  try {
    // 检查分支是否存在
    let branchExists = false;
    try {
      await api(`/git/refs/heads/${name}`);
      branchExists = true;
    } catch (e) { /* 不存在 */ }

    if (!branchExists) {
      showLog('⏳ 分支不存在，先创建分支...', 'info');
      const main = await api('/git/refs/heads/main');
      await api('/git/refs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ref: `refs/heads/${name}`, sha: main.object.sha })
      });
    }

    showLog('⏳ 正在创建 PR...', 'info');
    const pr = await api('/pulls', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: `review: ${name}`,
        head: name,
        base: 'main',
        body: `自动创建的分支审查\n\n---\n🤖 代码审查控制台`
      })
    });

    showLog(`✅ PR <b>#${pr.number}</b> 创建成功！<br><br>
      🔗 <a href="${pr.html_url}" target="_blank" style="color:var(--accent)">在 GitHub 查看</a><br><br>
      ⏳ 审查将在几秒后自动开始`, 'ok');
    setTimeout(loadAll, 3000);
  } catch (e) {
    let hint = '';
    if (e.message.includes('No commits between')) {
      hint = `<br><br>💡 <b>原因</b>：分支 <b>${name}</b> 和 main 内容相同，没有新提交，GitHub 不允许创建 PR。<br><br>
        <b>解决办法</b>：<br>
        1️⃣ 本地切到该分支：<code style="font-size:11px">git checkout -b ${name}</code><br>
        2️⃣ 修改一些代码<br>
        3️⃣ 提交推送：<code style="font-size:11px">git push -u origin ${name}</code><br>
        4️⃣ 再回来点「建PR」`;
    } else if (e.message.includes('A pull request already exists')) {
      hint = '<br><br>💡 该分支的 PR 已经存在，去 GitHub 查看即可。';
    }
    showLog('❌ 创建失败: ' + e.message + hint, 'err');
  } finally {
    setBtnLoading('btnPR', false, '建PR');
  }
}

async function updateStatus() {
  try {
    const s = await fetch('http://localhost:3456/api/status').then(r => r.json());
    document.getElementById('statusDot').className = 'dot ' + (s.authenticated ? 'on' : 'off');
    document.getElementById('statusText').textContent = s.authenticated ? `✅ ${s.repo}` : '❌ 未登录';
  } catch {
    document.getElementById('statusDot').className = 'dot off';
    document.getElementById('statusText').textContent = '❌ 服务器未启动';
  }
}

async function loadAll() {
  await Promise.all([updateStatus(), loadBranches()]);
  if (currentBranch) reloadDetail();
}

setInterval(() => { if (!document.hidden) loadBranches(); }, 30000);

loadAll();
</script>
</body>
</html>
