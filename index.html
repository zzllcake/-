<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 代码审查控制台</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --purple: #bc8cff;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 1400px; margin: 0 auto; }

/* Header */
.header {
  display: flex; align-items: center; gap: 16px;
  padding: 20px 0; border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.header h1 { font-size: 24px; font-weight: 600; }
.header .badge {
  background: var(--accent); color: #000; padding: 2px 10px;
  border-radius: 12px; font-size: 12px; font-weight: 600;
}
.header .repo-link {
  margin-left: auto; color: var(--accent); text-decoration: none;
  font-size: 14px;
}

/* Grid Layout */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

/* Cards */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
}
.card h2 {
  font-size: 16px; font-weight: 600; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.card h2 .icon { font-size: 20px; }

/* Branch Form */
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.form-group input, .form-group textarea {
  width: 100%; padding: 8px 12px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 14px;
}
.form-group input:focus, .form-group textarea:focus {
  outline: none; border-color: var(--accent);
}
.btn {
  padding: 8px 20px; border: none; border-radius: 6px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--accent); color: #000; }
.btn-danger { background: var(--red); color: #fff; }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-group { display: flex; gap: 8px; margin-top: 16px; }

.log-area {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; margin-top: 12px;
  font-family: 'Courier New', monospace; font-size: 13px;
  max-height: 200px; overflow-y: auto; color: var(--muted);
}
.log-area .log-success { color: var(--green); }
.log-area .log-error { color: var(--red); }
.log-area .log-info { color: var(--accent); }

/* Comment Area */
.comment-list { max-height: 400px; overflow-y: auto; }
.comment-item {
  padding: 12px; border: 1px solid var(--border); border-radius: 6px;
  margin-bottom: 8px; font-size: 14px;
}
.comment-item .comment-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; font-size: 12px; color: var(--muted);
}
.comment-item .comment-header .author { color: var(--accent); font-weight: 500; }
.comment-item .comment-body { line-height: 1.5; }
.comment-item .comment-body table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.comment-item .comment-body th, .comment-item .comment-body td {
  padding: 4px 8px; border: 1px solid var(--border); text-align: left;
}
.empty-state { color: var(--muted); text-align: center; padding: 40px; font-size: 14px; }

/* Error Overview */
.error-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; text-align: center;
}
.stat-card .number { font-size: 28px; font-weight: 700; }
.stat-card .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
.stat-card.green .number { color: var(--green); }
.stat-card.red .number { color: var(--red); }
.stat-card.blue .number { color: var(--accent); }
.stat-card.purple .number { color: var(--purple); }

.error-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.error-table th {
  background: var(--bg); padding: 8px 12px; text-align: left;
  border-bottom: 2px solid var(--border); font-weight: 600;
}
.error-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.error-table tr:hover { background: rgba(88,166,255,0.05); }

/* Loading */
.loading { text-align: center; color: var(--muted); padding: 20px; }
.loading::after { content: '...'; animation: dots 1.5s steps(4) infinite; }
@keyframes dots { 0% { content: '.'; } 25% { content: '..'; } 50% { content: '...'; } 75% { content: ''; } }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab {
  padding: 8px 20px; cursor: pointer; font-size: 14px; color: var(--muted);
  border-bottom: 2px solid transparent; transition: all 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Check run item */
.check-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.check-item:last-child { border-bottom: none; }
.check-pass { color: var(--green); }
.check-fail { color: var(--red); }
.check-pending { color: var(--yellow); }

/* Status indicator */
.status-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
}
.status-dot.pass { background: var(--green); }
.status-dot.fail { background: var(--red); }
.status-dot.pending { background: var(--yellow); }

/* Footer */
.footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0; margin-top: 20px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="container">

<!-- Header -->
<div class="header">
  <h1>🤖 代码审查控制台</h1>
  <span class="badge">v2.0</span>
  <a class="repo-link" href="https://github.com/zzllcake/-" target="_blank">📂 zzllcake/- →</a>
</div>

<!-- Stats Overview -->
<div class="error-stats" id="statsOverview">
  <div class="stat-card blue">
    <div class="number">92</div>
    <div class="label">ESLint 审查规则</div>
  </div>
  <div class="stat-card green">
    <div class="number">65</div>
    <div class="label">测试用例</div>
  </div>
  <div class="stat-card purple">
    <div class="number">100%</div>
    <div class="label">代码覆盖率</div>
  </div>
  <div class="stat-card red">
    <div class="number" id="prCount">-</div>
    <div class="label">活跃 PR</div>
  </div>
</div>

<!-- Main Grid -->
<div class="grid-2">

  <!-- Left: Branch Creation -->
  <div class="card">
    <h2><span class="icon">🌿</span> 创建新分支</h2>
    <div class="form-group">
      <label>分支名</label>
      <input type="text" id="branchName" placeholder="feat/功能名称 或 fix/修复描述" value="fix/review-issue">
    </div>
    <div class="form-group">
      <label>提交信息</label>
      <textarea id="commitMsg" rows="2">fix: 修复审查发现的问题</textarea>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="createBranch()">📦 创建分支</button>
      <button class="btn btn-primary" onclick="createPR()">🔄 创建 PR</button>
      <button class="btn btn-sm" style="background:var(--border);color:var(--text)" onclick="pushBranch()">⬆️ 推送</button>
    </div>
    <div class="log-area" id="branchLog">就绪，等待操作...</div>
  </div>

  <!-- Right: Review Comments -->
  <div class="card">
    <h2><span class="icon">💬</span> 审查评论</h2>
    <div class="tabs">
      <div class="tab active" onclick="switchTab(this,'comments')">PR 评论</div>
      <div class="tab" onclick="switchTab(this,'checks')">Checks 状态</div>
    </div>
    <div id="commentsTab" class="tab-content active">
      <div class="comment-list" id="commentList">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
    <div id="checksTab" class="tab-content">
      <div id="checksList">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>
</div>

<!-- Error Overview -->
<div class="card">
  <h2><span class="icon">📊</span> 错误类型总览</h2>
  <div class="tabs">
    <div class="tab active" onclick="switchTab(this,'errorCat')">按类别</div>
    <div class="tab" onclick="switchTab(this,'errorRules')">审查规则</div>
  </div>

  <div id="errorCatTab" class="tab-content active">
    <table class="error-table">
      <thead>
        <tr>
          <th>错误类别</th>
          <th>已捕获</th>
          <th>未捕获</th>
          <th>总计</th>
          <th>覆盖率</th>
        </tr>
      </thead>
      <tbody id="errorCatBody">
        <tr><td colspan="5" class="empty-state">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="errorRulesTab" class="tab-content">
    <table class="error-table">
      <thead>
        <tr>
          <th>规则</th>
          <th>级别</th>
          <th>说明</th>
          <th>状态</th>
        </tr>
      </thead>
      <tbody id="errorRulesBody">
        <tr><td colspan="4" class="empty-state">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="footer">
  自动代码审查系统 · 基于 GitHub Actions · 使用 GitHub API 实时交互
</div>

</div>

<script>
// ============================================================
// Configuration
// ============================================================
const REPO_OWNER = 'zzllcake';
const REPO_NAME = '-';
const API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`;

// ============================================================
// Branch Operations
// ============================================================
async function createBranch() {
  const name = document.getElementById('branchName').value.trim();
  if (!name) return log('请输入分支名', 'error');

  try {
    log(`创建分支: ${name}...`, 'info');
    const mainSha = await apiGet(`/git/refs/heads/main`);
    const sha = mainSha.object.sha;

    await apiPost('/git/refs', {
      ref: `refs/heads/${name}`,
      sha: sha
    });
    log(`✅ 分支 ${name} 创建成功！`, 'success');
  } catch (e) {
    log(`❌ 创建失败: ${e.message}`, 'error');
  }
}

async function pushBranch() {
  const name = document.getElementById('branchName').value.trim();
  if (!name) return log('请输入分支名', 'error');

  log(`分支 ${name} 已在远程创建。在本地执行:`, 'info');
  log(`  git checkout -b ${name}`, 'info');
  log(`  git push -u origin ${name}`, 'info');
  log(`然后去 GitHub 创建 PR`, 'info');
}

async function createPR() {
  const name = document.getElementById('branchName').value.trim();
  const msg = document.getElementById('commitMsg').value.trim() || 'fix: update';
  if (!name) return log('请输入分支名', 'error');

  try {
    // 先尝试创建分支（如果不存在）
    const branches = await apiGet('/branches');
    const exists = branches.some(b => b.name === name);
    if (!exists) await createBranch();

    log(`创建 PR: ${name} → main...`, 'info');
    const pr = await apiPost('/pulls', {
      title: msg,
      head: name,
      base: 'main',
      body: `## 自动创建的 PR\n\n${msg}\n\n---\n> 由 🤖 代码审查控制台 创建`
    });
    log(`✅ PR #${pr.number} 已创建: ${pr.html_url}`, 'success');
    loadPRComments();
    loadChecks();
  } catch (e) {
    log(`❌ 创建失败: ${e.message}`, 'error');
  }
}

function log(msg, type = 'info') {
  const area = document.getElementById('branchLog');
  area.innerHTML += `<div class="log-${type}">${msg}</div>`;
  area.scrollTop = area.scrollHeight;
}

// ============================================================
// GitHub API
// ============================================================
async function apiGet(path) {
  const res = await fetch(`${API}${path}`);
  if (!res.ok) throw new Error(`${res.status}: ${(await res.json()).message}`);
  return res.json();
}

async function apiPost(path, body) {
  const token = localStorage.getItem('gh_token');
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `token ${token}`;

  const res = await fetch(`${API}${path}`, {
    method: 'POST',
    headers,
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`${res.status}: ${(await res.json()).message}`);
  return res.json();
}

// ============================================================
// Load PR Comments
// ============================================================
async function loadPRComments() {
  const list = document.getElementById('commentList');
  try {
    const pulls = await apiGet('/pulls?state=open&sort=updated&direction=desc');
    document.getElementById('prCount').textContent = pulls.length;

    if (pulls.length === 0) {
      list.innerHTML = '<div class="empty-state">暂无活跃 PR</div>';
      return;
    }

    let html = '';
    for (const pr of pulls.slice(0, 3)) {
      html += `<div class="comment-item">
        <div class="comment-header">
          <span><span class="author">#${pr.number}</span> ${pr.title}</span>
          <span><span class="status-dot ${pr.mergeable === 'CONFLICTING' ? 'fail' : 'pending'}"></span>${pr.mergeable === 'CONFLICTING' ? '冲突' : '可合并'}</span>
        </div>
        <div class="comment-body">${(pr.body || '').slice(0, 200)}</div>
      </div>`;

      // 获取这个 PR 的评论
      try {
        const comments = await apiGet(`/issues/${pr.number}/comments`);
        for (const c of comments.slice(0, 2)) {
          html += `<div class="comment-item" style="margin-left: 20px; font-size: 13px;">
            <div class="comment-header">
              <span><span class="author">🤖 ${c.user.login}</span></span>
              <span>${new Date(c.created_at).toLocaleString()}</span>
            </div>
            <div class="comment-body">${(c.body || '').slice(0, 300)}</div>
          </div>`;
        }
      } catch(e) {}
    }
    list.innerHTML = html;
  } catch(e) {
    list.innerHTML = `<div class="empty-state">加载失败: ${e.message}</div>`;
  }
}

// ============================================================
// Load Checks
// ============================================================
async function loadChecks() {
  const list = document.getElementById('checksList');
  try {
    const runs = await apiGet('/actions/runs?per_page=5&status=completed');
    if (!runs.workflow_runs || runs.workflow_runs.length === 0) {
      list.innerHTML = '<div class="empty-state">暂无运行记录</div>';
      return;
    }

    let html = '';
    for (const run of runs.workflow_runs.slice(0, 5)) {
      const conclusion = run.conclusion || 'pending';
      const icon = conclusion === 'success' ? '✅' : conclusion === 'failure' ? '❌' : '⏳';
      const label = conclusion === 'success' ? '通过' : conclusion === 'failure' ? '失败' : '运行中';

      html += `<div class="check-item">
        <span>${icon}</span>
        <span style="flex:1">${run.display_title?.slice(0,50) || '运行'}</span>
        <span>${run.head_branch}</span>
        <span style="color:${conclusion === 'success' ? 'var(--green)' : 'var(--red)'}">${label}</span>
      </div>`;
    }
    list.innerHTML = html;
  } catch(e) {
    list.innerHTML = `<div class="empty-state">加载失败: ${e.message}（GitHub API 未认证，部分功能受限）</div>`;
  }
}

// ============================================================
// Error Categories
// ============================================================
const errorCategories = [
  { cat: '基础 JS 错误', captured: 2500, total: 2500, pct: 100 },
  { cat: 'TypeScript 类型', captured: 2800, total: 3000, pct: 93 },
  { cat: '异步/Promise', captured: 1800, total: 2000, pct: 90 },
  { cat: '安全/规范', captured: 1800, total: 2000, pct: 90 },
  { cat: '可维护性/复杂度', captured: 1700, total: 2000, pct: 85 },
  { cat: '代码风格', captured: 1800, total: 2000, pct: 90 },
  { cat: 'Import/模块', captured: 1300, total: 1500, pct: 87 },
  { cat: '正则错误', captured: 800, total: 1000, pct: 80 },
  { cat: '边界/异常', captured: 1200, total: 1500, pct: 80 },
  { cat: '组合模式', captured: 2000, total: 2496, pct: 80 },
];

const errorRules = [
  { rule: 'eqeqeq', level: 'error', desc: '强制 === 而非 ==', status: '✅' },
  { rule: 'no-var', level: 'error', desc: '禁止 var', status: '✅' },
  { rule: 'no-eval', level: 'error', desc: '禁止 eval', status: '✅' },
  { rule: 'no-debugger', level: 'error', desc: '禁止 debugger', status: '✅' },
  { rule: 'no-new-wrappers', level: 'error', desc: '禁止 new String/Number/Boolean', status: '✅' },
  { rule: 'no-caller', level: 'error', desc: '禁止 arguments.callee', status: '✅' },
  { rule: 'no-proto', level: 'error', desc: '禁止 __proto__', status: '✅' },
  { rule: 'no-implied-eval', level: 'error', desc: '禁止 setTimeout 字符串', status: '✅' },
  { rule: 'prefer-template', level: 'error', desc: '优先模板字符串', status: '✅' },
  { rule: 'prefer-optional-chain', level: 'error', desc: '优先可选链', status: '✅' },
  { rule: 'no-await-in-loop', level: 'error', desc: '不在循环中 await', status: '✅' },
  { rule: 'no-constructor-return', level: 'error', desc: '构造函数不返回值', status: '✅' },
  { rule: 'no-promise-executor-return', level: 'error', desc: 'Promise 不返回值', status: '✅' },
  { rule: 'no-dupe-else-if', level: 'error', desc: '禁止重复条件', status: '✅' },
  { rule: 'no-loss-of-precision', level: 'error', desc: '精度不丢失', status: '✅' },
  { rule: 'no-sparse-arrays', level: 'error', desc: '禁止稀疏数组', status: '✅' },
  { rule: 'no-unreachable-loop', level: 'error', desc: '禁止死循环', status: '✅' },
  { rule: 'no-self-compare', level: 'error', desc: '禁止自身比较', status: '✅' },
  { rule: 'no-else-return', level: 'error', desc: 'return 后不 else', status: '✅' },
  { rule: 'no-param-reassign', level: 'error', desc: '不修改参数', status: '✅' },
  { rule: 'prefer-object-spread', level: 'error', desc: '优先展开运算符', status: '✅' },
  { rule: 'no-array-constructor', level: 'error', desc: '不 new Array()', status: '✅' },
  { rule: 'max-params', level: 'warn', desc: '最多 5 个参数', status: '⚠️' },
  { rule: 'max-depth', level: 'warn', desc: '最深 4 层嵌套', status: '⚠️' },
  { rule: 'complexity', level: 'warn', desc: '圈复杂度 ≤ 10', status: '⚠️' },
  { rule: 'import/order', level: 'error', desc: 'Import 排序', status: '✅' },
  { rule: 'no-duplicate-imports', level: 'error', desc: '禁止重复导入', status: '✅' },
  { rule: '@typescript-eslint/no-explicit-any', level: 'error', desc: '禁止 any', status: '✅' },
  { rule: '@typescript-eslint/no-floating-promises', level: 'error', desc: 'Promise 必须处理', status: '✅' },
  { rule: '@typescript-eslint/require-await', level: 'error', desc: 'async 需要 await', status: '✅' },
  { rule: '@typescript-eslint/prefer-for-of', level: 'error', desc: '优先 for-of', status: '✅' },
  { rule: '@typescript-eslint/prefer-includes', level: 'error', desc: '优先 includes', status: '✅' },
  { rule: '@typescript-eslint/prefer-as-const', level: 'error', desc: '优先 as const', status: '✅' },
  { rule: '@typescript-eslint/array-type', level: 'error', desc: '统一数组类型', status: '✅' },
  { rule: '@typescript-eslint/unified-signatures', level: 'error', desc: '统一重载签名', status: '✅' },
];

function loadErrorCategories() {
  const tbody = document.getElementById('errorCatBody');
  let html = '';
  for (const e of errorCategories) {
    const uncaptured = e.total - e.captured;
    const bg = e.pct === 100 ? 'var(--green)' : e.pct >= 80 ? 'var(--yellow)' : 'var(--red)';
    html += `<tr>
      <td>${e.cat}</td>
      <td>${e.captured}</td>
      <td>${uncaptured > 0 ? uncaptured : 0}</td>
      <td>${e.total}</td>
      <td><div style="background:var(--bg);border-radius:10px;overflow:hidden">
        <div style="background:${bg};width:${e.pct}%;padding:2px 8px;border-radius:10px;font-size:12px;color:#000">${e.pct}%</div>
      </div></td>
    </tr>`;
  }
  tbody.innerHTML = html;
}

function loadErrorRules() {
  const tbody = document.getElementById('errorRulesBody');
  let html = '';
  for (const r of errorRules) {
    const lvlColor = r.level === 'error' ? 'var(--red)' : 'var(--yellow)';
    html += `<tr>
      <td><code>${r.rule}</code></td>
      <td><span style="color:${lvlColor}">${r.level}</span></td>
      <td>${r.desc}</td>
      <td>${r.status}</td>
    </tr>`;
  }
  tbody.innerHTML = html;
}

// ============================================================
// Utils
// ============================================================
function switchTab(el, tabName) {
  const parent = el.parentElement.parentElement;
  parent.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  parent.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(tabName + 'Tab').classList.add('active');
}
