# =============================================================================
# 自动代码审查工作流 v2
# 在 PR 提交后自动运行 lint、test、静态分析并生成审查评论
# =============================================================================

name: Code Review

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:

  # ----------------------------------------------------------
  # Job 1: Lint & Format
  # ----------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --legacy-peer-deps

      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  # ----------------------------------------------------------
  # Job 2: TypeScript 类型检查
  # ----------------------------------------------------------
  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck

  # ----------------------------------------------------------
  # Job 3: 单元测试（矩阵多版本）
  # ----------------------------------------------------------
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run test:ci
        continue-on-error: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-report-node-${{ matrix.node-version }}
          path: reports/
          retention-days: 7

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  # ----------------------------------------------------------
  # Job 4: 安全扫描
  # ----------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --legacy-peer-deps

      - name: npm audit
        run: |
          npm audit --audit-level=high 2>&1 | tee npm-audit-output.txt || true

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: npm-audit-report
          path: npm-audit-output.txt
          retention-days: 7

      - name: CodeQL Init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v3

  # ----------------------------------------------------------
  # Job 5: 汇总结果 → PR 评论
  # ----------------------------------------------------------
  review-comment:
    name: Review Summary
    needs: [lint, type-check, test, security]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: read
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // ================================================================
            // 1. 获取当前运行的所有 Job 状态
            // ================================================================
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const summaryJobs = jobs.jobs.filter(j => j.name !== 'Review Summary' && j.name !== 'Checkout');

            // ================================================================
            // 2. 构建结果表格
            // ================================================================
            const getEmoji = (c) =>
              c === 'success' ? ':white_check_mark:' :
              c === 'failure' ? ':x:' :
              c === 'cancelled' ? ':no_entry:' :
              c === 'skipped' ? ':heavy_minus_sign:' : ':grey_question:';

            const getLabel = (c) =>
              c === 'success' ? '通过' :
              c === 'failure' ? '**失败**' :
              c === 'cancelled' ? '已取消' :
              c === 'skipped' ? '跳过' : (c || '等待中');

            let hasFailure = false;
            let rows = '';
            let failures = [];

            for (const job of summaryJobs) {
              const s = job.conclusion || job.status;
              if (s === 'failure') hasFailure = true;

              rows += `| ${getEmoji(s)} ${job.name} | ${getLabel(s)} |\n`;

              if (s === 'failure') {
                const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/job/${job.id}`;
                failures.push(`- [:x: **${job.name}**](${url})`);
              }
            }

            // ================================================================
            // 3. 组装 Markdown 评论
            // ================================================================
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const shortSha = context.sha.slice(0, 7);
            const passed = summaryJobs.filter(j => j.conclusion === 'success').length;
            const total = summaryJobs.length;

            let body = `## 🤖 自动代码审查结果\n\n`;
            body += `| 检查项 | 状态 |\n`;
            body += `|--------|------|\n`;
            body += rows;
            body += `\n`;
            body += `> 提交: \`${shortSha}\` · [查看完整运行日志](${runUrl})\n\n`;

            if (hasFailure) {
              body += `### ❌ 失败的检查项\n\n`;
              body += failures.join('\n') + '\n\n';
              body += `请修复上述问题后重新推送代码。\n\n`;
              body += `---\n`;
              body += `> 💡 修复后推送新 commit，审查会自动重新运行。`;
            } else if (passed === total) {
              body += `### ✅ 全部通过！\n\n`;
              body += `${passed}/${total} 项检查均通过，可以合并 PR。`;
            } else {
              body += `### ⚠️ 部分检查未完成\n\n`;
              body += `${passed}/${total} 项通过，请查看日志了解详情。`;
            }

            // ================================================================
            // 4. 发布或更新评论
            // ================================================================
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body?.startsWith('## 🤖 自动代码审查结果')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else if (hasFailure) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

            console.log(`审查完成: ${passed}/${total} 通过` + (hasFailure ? ', 有失败项' : ''));
