# =============================================================================
# 自动代码审查工作流 v2
# 在 PR 提交后自动运行 lint、test、静态分析并生成审查评论
# =============================================================================

name: 🤖 代码审查

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:

  # ----------------------------------------------------------
  # Job 1: Lint & Format（分级统计 + 完整报告）
  # ----------------------------------------------------------
  lint:
    name: 🔍 代码规范检查
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.stats.outputs.total }}
      errors: ${{ steps.stats.outputs.errors }}
      warnings: ${{ steps.stats.outputs.warnings }}
      parse_failed: ${{ steps.stats.outputs.parse_failed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --legacy-peer-deps

      # 完整统计扫描（error/warning 分级，解析失败容错）
      - name: ESLint 完整扫描
        id: eslint
        run: node scripts/lint-report.cjs
        continue-on-error: true

      # 把统计写入步骤摘要（突破 API 注解数量限制）
      - name: 输出统计到摘要
        if: always()
        run: |
          if [ -f reports/eslint-summary.json ]; then
            node -e "
              const s = require('./reports/eslint-summary.json');
              const lines = [];
              lines.push('### 📊 ESLint 完整统计');
              lines.push('');
              lines.push('| 指标 | 数量 |');
              lines.push('|------|------|');
              lines.push('| 总问题数 | ' + s.统计.总数 + ' |');
              lines.push('| ❌ error | ' + s.统计.error数量 + ' |');
              lines.push('| ⚠️ warning | ' + s.统计.warning数量 + ' |');
              lines.push('| 💡 info | ' + s.统计.info数量 + ' |');
              lines.push('| 涉及文件 | ' + s.统计.涉及文件数 + ' |');
              lines.push('| 可自动修复 | ' + s.统计.可自动修复 + ' |');
              lines.push('');
              lines.push('**规则命中 TOP 15:**');
              lines.push('');
              lines.push('| 次数 | 规则 |');
              lines.push('|------|------|');
              Object.entries(s.规则统计).slice(0, 15).forEach(([r, c]) => lines.push('| ' + c + ' | \`' + r + '\` |'));
              lines.push('');
              if (s.解析失败数 > 0) {
                lines.push('> ⚠️ 有 ' + s.解析失败数 + ' 个文件解析失败（已记录，未跳过）');
              }
              lines.push('> 📄 完整报告见 Artifact: **eslint-report**');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
            "
          fi

      # 上传完整报告（前端可通过 artifact 获取全部结果）
      - name: 上传完整报告
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eslint-report
          path: reports/
          retention-days: 30

      # 输出错误数量供后续 job 使用
      - name: 设置输出变量
        id: stats
        if: always()
        run: |
          if [ -f reports/eslint-summary.json ]; then
            echo "total=$(node -p "require('./reports/eslint-summary.json').统计.总数")" >> $GITHUB_OUTPUT
            echo "errors=$(node -p "require('./reports/eslint-summary.json').统计.error数量")" >> $GITHUB_OUTPUT
            echo "warnings=$(node -p "require('./reports/eslint-summary.json').统计.warning数量")" >> $GITHUB_OUTPUT
            echo "parse_failed=$(node -p "require('./reports/eslint-summary.json').解析失败数")" >> $GITHUB_OUTPUT
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "errors=0" >> $GITHUB_OUTPUT
            echo "warnings=0" >> $GITHUB_OUTPUT
            echo "parse_failed=0" >> $GITHUB_OUTPUT
          fi

      # 有 error 则失败（warning 不阻断）
      - name: 检查结果
        run: |
          if [ -f reports/eslint-summary.json ]; then
            ERRORS=$(node -p "require('./reports/eslint-summary.json').统计.error数量")
            if [ "$ERRORS" -gt 0 ]; then
              echo "❌ 发现 $ERRORS 个 error 级问题"
              exit 1
            fi
            echo "✅ 无 error 级问题"
          fi

      - name: Prettier 格式检查
        run: npm run format:check
        continue-on-error: true

  # ----------------------------------------------------------
  # Job 2: TypeScript 类型检查
  # ----------------------------------------------------------
  type-check:
    name: 🔷 类型安全检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck

  # ----------------------------------------------------------
  # Job 3: 单元测试（矩阵多版本）
  # ----------------------------------------------------------
  test:
    name: 🧪 测试 (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run test:ci
        continue-on-error: true

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: success() || failure()
        with:
          name: test-report-node-${{ matrix.node-version }}
          path: reports/
          retention-days: 7

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        if: success() || failure()
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  # ----------------------------------------------------------
  # Job 4: 安全扫描
  # ----------------------------------------------------------
  security:
    name: 🛡️ 安全扫描
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --legacy-peer-deps

      - name: npm audit
        run: |
          npm audit --audit-level=high 2>&1 | tee npm-audit-output.txt || true

      - uses: actions/upload-artifact@v5
        if: success() || failure()
        with:
          name: npm-audit-report
          path: npm-audit-output.txt
          retention-days: 7

      - name: CodeQL Init
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v4

  # ----------------------------------------------------------
  # Job 5: 汇总结果 → PR 评论
  # ----------------------------------------------------------
  review-comment:
    name: 📝 审查汇总
    needs: [lint, type-check, test, security]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: read
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // ================================================================
            // 1. 获取当前运行的所有 Job 状态
            // ================================================================
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const summaryJobs = jobs.jobs.filter(j => j.name !== '📝 审查汇总' && j.name !== 'Checkout');

            // ================================================================
            // 2. 构建结果表格
            // ================================================================
            const getEmoji = (c) =>
              c === 'success' ? ':white_check_mark:' :
              c === 'failure' ? ':x:' :
              c === 'cancelled' ? ':no_entry:' :
              c === 'skipped' ? ':heavy_minus_sign:' : ':grey_question:';

            const getLabel = (c) =>
              c === 'success' ? '通过' :
              c === 'failure' ? '**失败**' :
              c === 'cancelled' ? '已取消' :
              c === 'skipped' ? '跳过' : (c || '等待中');

            let hasFailure = false;
            let rows = '';
            let failures = [];

            for (const job of summaryJobs) {
              const s = job.conclusion || job.status;
              if (s === 'failure') hasFailure = true;

              rows += `| ${getEmoji(s)} ${job.name} | ${getLabel(s)} |\n`;

              if (s === 'failure') {
                const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/job/${job.id}`;
                failures.push(`- [:x: **${job.name}**](${url})`);
              }
            }

            // ================================================================
            // 3. 组装 Markdown 评论
            // ================================================================
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const shortSha = context.sha.slice(0, 7);
            const passed = summaryJobs.filter(j => j.conclusion === 'success').length;
            const total = summaryJobs.length;

            let body = `## 🤖 自动代码审查结果\n\n`;
            body += `| 检查项 | 状态 |\n`;
            body += `|--------|------|\n`;
            body += rows;
            body += `\n`;

            // ---- 分级统计（来自 lint job 的完整扫描）----
            const lintTotal = '${{ needs.lint.outputs.total }}';
            const lintErrors = '${{ needs.lint.outputs.errors }}';
            const lintWarnings = '${{ needs.lint.outputs.warnings }}';
            const parseFailed = '${{ needs.lint.outputs.parse_failed }}';

            if (lintTotal && lintTotal !== '' && lintTotal !== '0') {
              body += `### 📊 代码问题分级统计\n\n`;
              body += `| 等级 | 数量 | 说明 |\n`;
              body += `|------|------|------|\n`;
              body += `| ❌ error | **${lintErrors}** | 阻断级问题（安全/类型/未定义） |\n`;
              body += `| ⚠️ warning | **${lintWarnings}** | 建议修复（规范/风格/复杂度） |\n`;
              body += `| 📋 合计 | **${lintTotal}** | 全部问题数量 |\n\n`;
              if (parseFailed && parseFailed !== '0') {
                body += `> ⚠️ 有 **${parseFailed}** 个文件解析失败，已记录为 info 级别（未静默跳过）\n\n`;
              }
              body += `> 📄 完整问题列表（${lintTotal} 条，不截断）见 Artifact: [**eslint-report**](${runUrl}#artifacts)\n\n`;
            }

            body += `> 提交: \`${shortSha}\` · [查看完整运行日志](${runUrl})\n\n`;

            if (hasFailure) {
              body += `### ❌ 失败的检查项\n\n`;
              body += failures.join('\n') + '\n\n';
              body += `请修复上述问题后重新推送代码。\n\n`;
              body += `---\n`;
              body += `> 💡 修复后推送新 commit，审查会自动重新运行。`;
            } else if (passed === total) {
              body += `### ✅ 全部通过！\n\n`;
              body += `${passed}/${total} 项检查均通过，可以合并 PR。`;
              if (lintWarnings && lintWarnings !== '0') {
                body += `\n\n> ⚠️ 但有 ${lintWarnings} 个 warning 建议关注（不阻断合并）。`;
              }
            } else {
              body += `### ⚠️ 部分检查未完成\n\n`;
              body += `${passed}/${total} 项通过，请查看日志了解详情。`;
            }

            // ================================================================
            // 4. 发布或更新评论
            // ================================================================
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body?.startsWith('## 🤖 自动代码审查结果')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else if (hasFailure) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

            console.log(`审查完成: ${passed}/${total} 通过` + (hasFailure ? ', 有失败项' : ''));
